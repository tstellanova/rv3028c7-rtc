[package]
name = "rv3028c7-rtc"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Todd Stellanova <tstellanova@users.noreply.github.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/tstellanova/rv3028c7-rtc"
description = "RV-3028-C7 and similar Real Time Clock (RTC) no_std driver"
readme = "README.md"
keywords = ["no-std", "driver", "embedded-hal", "i2c", "rtc"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
embedded-hal = "1.0.0"
rtcc = "0.4.0"
chrono = { version = "0.4.45", default-features = false }

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
embedded-hal-bus = "0.3.0"
ds323x = "0.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["alloc","clock"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
linux-embedded-hal = { version = "0.5.0", default-features = false, features = ["i2c"] }
gpiocdev = "0.8.0"
spin_sleep = "1.3.3"


