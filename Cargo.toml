[package]
name = "rv3028c7-rtc"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Todd Stellanova <tstellanova@users.noreply.github.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/tstellanova/rv3028c7-rtc"
description = "RV-3028-C7 and similar Real Time Clock (RTC) no_std driver"
readme = "README.md"
keywords = ["no-std", "driver", "embedded-hal", "i2c", "rtc"]
categories = ["embedded", "hardware-support", "no-std"]

[package.metadata.docs.rs]
# document both date/time backends
all-features = true

[features]
default = ["chrono"]
# chrono date/time types, including the rtcc `DateTimeAccess` trait
chrono = ["dep:chrono", "dep:rtcc"]
# jiff date/time types, via the `JiffDateTimeAccess` trait
jiff = ["dep:jiff"]

[dependencies]
embedded-hal = "1.0.0"
rtcc = { version = "0.4.0", optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
jiff = { version = "0.2.38", default-features = false, optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
embedded-hal-bus = "0.3.0"
ds323x = "0.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["alloc","clock"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
linux-embedded-hal = { version = "0.5.0", default-features = false, features = ["i2c"] }
gpiocdev = "0.8.0"
spin_sleep = "1.3.3"

[[example]]
name = "alarm_int"
required-features = ["chrono"]

[[example]]
name = "comp_mux"
required-features = ["chrono"]

[[example]]
name = "countdown"
required-features = ["chrono"]

[[example]]
name = "countdown_int"
required-features = ["chrono"]

[[example]]
name = "ext_evt"
required-features = ["chrono"]

[[example]]
name = "long_clock_setup"
required-features = ["chrono"]

[[example]]
name = "muxit"
required-features = ["chrono"]

[[example]]
name = "rpil"
required-features = ["chrono"]

[[example]]
name = "set_alarm"
required-features = ["chrono"]

[[example]]
name = "trickle"
required-features = ["chrono"]

[[example]]
name = "trickle_mux"
required-features = ["chrono"]

[[example]]
name = "jiff_alarm"
required-features = ["jiff"]
